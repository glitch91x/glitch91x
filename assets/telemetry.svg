<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#13171F" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E7681" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E6EDF3" stop-opacity="1" />
      <stop offset="100%" stop-color="#6E7681" stop-opacity="0.2" />
    </linearGradient>

    <pattern id="scopeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262D" stroke-width="0.7" />
    </pattern>

    <clipPath id="scopeClip">
      <rect x="24" y="20" width="520" height="80" rx="4" />
    </clipPath>

    <filter id="softGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.4px;
      fill: #8B949E;
    }
    .val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.2px;
      fill: #E6EDF3;
    }
    .wave {
      fill: none;
      stroke: url(#waveGrad);
      stroke-width: 1.8;
      stroke-linejoin: round;
      filter: url(#softGlow);
      animation: scrollWave 2.8s linear infinite;
    }
    .dot1 { animation: blink 1.8s ease-in-out infinite; }
    .dot2 { animation: blink 2.4s ease-in-out infinite 0.6s; }
    .dot3 { animation: blink 2.0s ease-in-out infinite 1.2s; }

    @keyframes scrollWave {
      from { transform: translateX(0px); }
      to   { transform: translateX(-130px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
  </style>

  
  <rect width="900" height="120" rx="10" fill="url(#bg)" stroke="#30363D" stroke-width="1.5" />

  
  <rect x="24" y="20" width="520" height="80" rx="4" fill="#0B0E14" stroke="#262C36" stroke-width="1.2" />
  <rect x="24" y="20" width="520" height="80" rx="4" fill="url(#scopeGrid)" />
  <line x1="24" y1="60" x2="544" y2="60" stroke="#30363D" stroke-width="0.8" stroke-dasharray="4 4" />

  
  <g clip-path="url(#scopeClip)">
    <path class="wave" d="M 24 60
      l 20 0 l 8 6 l 10 -32 l 10 50 l 8 -28 l 10 6 l 10 -2 l 19 0 l 0 -12 l 15 0 l 0 12 l 20 0
      l 20 0 l 8 6 l 10 -32 l 10 50 l 8 -28 l 10 6 l 10 -2 l 19 0 l 0 -12 l 15 0 l 0 12 l 20 0
      l 20 0 l 8 6 l 10 -32 l 10 50 l 8 -28 l 10 6 l 10 -2 l 19 0 l 0 -12 l 15 0 l 0 12 l 20 0
      l 20 0 l 8 6 l 10 -32 l 10 50 l 8 -28 l 10 6 l 10 -2 l 19 0 l 0 -12 l 15 0 l 0 12 l 20 0
      l 20 0 l 8 6 l 10 -32 l 10 50 l 8 -28 l 10 6 l 10 -2 l 19 0 l 0 -12 l 15 0 l 0 12 l 20 0" />
  </g>

  
  <circle class="dot1" cx="578" cy="37" r="3" fill="#E6EDF3" />
  <text x="592" y="41" class="label">CH01 // EMBEDDED</text>
  <text x="790" y="41" class="val">[ACTIVE]</text>

  <circle class="dot2" cx="578" cy="61" r="3" fill="#C9D1D9" />
  <text x="592" y="65" class="label">CH02 // ROS2_NAV</text>
  <text x="790" y="65" class="val">[LOCKED]</text>

  <circle class="dot3" cx="578" cy="85" r="3" fill="#8B949E" />
  <text x="592" y="89" class="label">CH03 // EDGE_CV</text>
  <text x="790" y="89" class="val">[NOMINAL]</text>
</svg>