<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B949E" />
      <stop offset="50%" stop-color="#F0F6FC" />
      <stop offset="100%" stop-color="#8B949E" />
    </linearGradient>

    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#13171F" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="0.8" />
    </pattern>

    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 6px;
      fill: url(#silverGrad);
    }
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 3px;
      fill: #8B949E;
    }
    .meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #6E7681;
    }
    .trace-base {
      fill: none;
      stroke: #262C36;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .trace-pulse {
      fill: none;
      stroke: #E6EDF3;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 28 240;
      filter: url(#glow);
      animation: flow 3.5s linear infinite;
    }
    .trace-pulse-slow {
      fill: none;
      stroke: #A5B1C2;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 20 260;
      animation: flow 5s linear infinite reverse;
    }
    .scanline {
      animation: scan 6s ease-in-out infinite;
    }
    .cursor {
      animation: blink 1.1s step-end infinite;
    }
    .status-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
    .reticle {
      transform-origin: 790px 110px;
      animation: spin 18s linear infinite;
    }

    @keyframes flow {
      from { stroke-dashoffset: 268; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(0px); opacity: 0.12; }
      50%      { transform: translateY(190px); opacity: 0.25; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 3.2; }
      50%      { opacity: 0.35; r: 2.2; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  
  <rect width="900" height="220" rx="10" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />
  <rect width="900" height="220" rx="10" fill="url(#grid)" opacity="0.7" />

  
  <rect class="scanline" x="10" y="12" width="880" height="2" fill="url(#silverGrad)" />

  
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#8B949E" stroke-width="1.5" />
  <path d="M 864 18 L 882 18 L 882 36" fill="none" stroke="#8B949E" stroke-width="1.5" />
  <path d="M 18 184 L 18 202 L 36 202" fill="none" stroke="#8B949E" stroke-width="1.5" />
  <path d="M 864 202 L 882 202 L 882 184" fill="none" stroke="#8B949E" stroke-width="1.5" />

  
  <path class="trace-base" d="M 20 75 L 95 75 L 120 100 L 185 100" />
  <path class="trace-pulse" d="M 20 75 L 95 75 L 120 100 L 185 100" />
  <circle cx="185" cy="100" r="3" fill="#0D1117" stroke="#8B949E" stroke-width="1.5" />

  <path class="trace-base" d="M 20 145 L 80 145 L 105 120 L 160 120" />
  <path class="trace-pulse-slow" d="M 20 145 L 80 145 L 105 120 L 160 120" />
  <circle cx="160" cy="120" r="3" fill="#0D1117" stroke="#8B949E" stroke-width="1.5" />

  
  <path class="trace-base" d="M 880 70 L 805 70 L 780 95 L 725 95" />
  <path class="trace-pulse-slow" d="M 880 70 L 805 70 L 780 95 L 725 95" />
  <circle cx="725" cy="95" r="3" fill="#0D1117" stroke="#8B949E" stroke-width="1.5" />

  <path class="trace-base" d="M 880 150 L 815 150 L 790 125 L 735 125" />
  <path class="trace-pulse" d="M 880 150 L 815 150 L 790 125 L 735 125" />
  <circle cx="735" cy="125" r="3" fill="#0D1117" stroke="#8B949E" stroke-width="1.5" />

  
  <g class="reticle" opacity="0.35">
    <circle cx="790" cy="110" r="38" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="790" cy="110" r="24" fill="none" stroke="#6E7681" stroke-width="1" stroke-dasharray="14 8" />
    <line x1="790" y1="64" x2="790" y2="74" stroke="#C9D1D9" stroke-width="1.2" />
    <line x1="790" y1="146" x2="790" y2="156" stroke="#C9D1D9" stroke-width="1.2" />
    <line x1="744" y1="110" x2="754" y2="110" stroke="#C9D1D9" stroke-width="1.2" />
    <line x1="826" y1="110" x2="836" y2="110" stroke="#C9D1D9" stroke-width="1.2" />
  </g>

  
  <circle class="status-dot" cx="42" cy="36" r="3" fill="#E6EDF3" />
  <text x="54" y="40" class="meta">SYS.ONLINE // REV 2.4</text>
  <text x="728" y="40" class="meta">CSE // EMBEDDED &amp; CV</text>

  
  <text x="450" y="108" text-anchor="middle" class="title">
    GLITCH<tspan class="cursor" fill="#E6EDF3">_</tspan>
  </text>

  
  <line x1="255" y1="126" x2="645" y2="126" stroke="url(#silverGrad)" stroke-width="1" opacity="0.6" />

  
  <text x="450" y="152" text-anchor="middle" class="subtitle">
    COMPUTER SCIENCE ENGINEER  •  ROBOTICS  •  AI / CV
  </text>

  
  <text x="40" y="190" class="meta">ARCH: ARM / x86_64 / ESP32</text>
  <text x="735" y="190" class="meta">BUILD: STABLE</text>
</svg>